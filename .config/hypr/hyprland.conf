env = WLR_NO_HARDWARE_CURSORS,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = AQ_DRM_DEVICES,/dev/dri/amd-igpu
env = XDG_CURRENT_DESKTOP,Hyprland
env = GNOME_KEYRING_CONTROL,/run/user/1000/keyring
#env = GDK_BACKEND,wayland,x11,*
#env = QT_QPA_PLATFORM,wayland;xcb
#env = MOZ_ENABLE_WAYLAND,1
#env = ELECTRON_OZONE_PLATFORM_HINT,wayland
#env = XDG_SESSION_TYPE,wayland
#env = XDG_CURRENT_DESKTOP,Hyprland


monitor =,preferred,auto,1

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 8

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}


# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 5
    rounding_power = 2
    dim_inactive = true
    dim_strength = 0.1
    # Change transparency of focused and unfocused windows
    active_opacity = 0.9
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
	#ignore_opacity = true
        vibrancy = 0.1696
    }
}


# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}


# Inputs
input {
    touchpad {
	disable_while_typing = true,
	natural_scroll = true,
    }
}

gesture = 3, horizontal, workspace

windowrule = match:class brave-browser, opaque on
windowrule = match:class org.kde.dolphin, float on, center on, workspace 4
#windowrule = match:class Alacritty, workspace special:term

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
#dwindle {
#    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
#    preserve_split = true # You probably want this
#}



$mainmod = SUPER

exec-once = waybar
exec-once = dunst
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hyprpaper
exec-once = ~/.config/hypr/scripts/restore-wallpaper.sh
exec-once = cliphist load
exec-once = ~/.config/hypr/scripts/clipboard.sh
exec-once = dunst
exec-once = ~/.config/hypr/scripts/battery-monitor.sh
exec-once = ~/.config/hypr/scripts/my-startup.sh
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/gvfsd

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle


# ── Screen brightness ────────────────────────────────────────
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -d amdgpu_bl0 s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl -d amdgpu_bl0 s 5%-


# ── Rofi menus ───────────────────────────────────────────────
bind = $mainmod SHIFT, W, exec, ~/.config/hypr/scripts/rofi-wifi.sh
bind = $mainmod SHIFT, B, exec, ~/.config/hypr/scripts/rofi-bluetooth.sh
bind = $mainmod SHIFT, O, exec, ~/.config/hypr/scripts/rotate-screen.sh


# ── Screenshots ───────────────────────────────────────────────

# Full screen screenshot → saved to ~/Pictures/Screenshots
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "󰄀 Screenshot" "Full screen saved"
# Select region → saved to ~/Pictures/Screenshots
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "󰄀 Screenshot" "Region saved"
# Full screen → copied to clipboard
bind = CTRL, Print, exec, grim - | wl-copy && notify-send "󰄀 Screenshot" "Full screen copied to clipboard"
# Select region → copied to clipboard
bind = CTRL SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "󰄀 Screenshot" "Region copied to clipboard"


bind = $mainmod, L, exec, hyprlock
bind = $mainmod SHIFT, L, exec, hyprshutdown
bind = $mainmod, V, exec, cliphist list | rofi -dmenu -i -p "Clipboard: " | cliphist decode | wl-copy


bind = $mainmod, W, exec, ~/.config/hypr/scripts/rofi-wallpaper.sh

bind = $mainmod, RETURN, exec, alacritty
bind = $mainmod, D, exec, rofi -show drun
bind = $mainmod, E, exec, dolphin
bind = $mainmod, Q, killactive
bind = $mainmod, M, exit
bind = $mainmod Shift, R, exec, hyprctl reload 
bind = $mainmod, B, exec, firefox --ozone-platform=wayland
bind = $mainmod, F, fullscreen
bind = $mainmod, Tab, cyclenext
bind = $mainmod, SPACE, togglefloating
bind = $mainmod, P, pin


bind = $mainmod, left, movefocus, l 
bind = $mainmod, right, movefocus, r 
bind = $mainmod, up, movefocus, u 
bind = $mainmod, down, movefocus, d

bind = $mainmod SHIFT, left, swapwindow, l
bind = $mainmod SHIFT, right, swapwindow, r
bind = $mainmod SHIFT, up, swapwindow, u
bind = $mainmod SHIFT, down, swapwindow, d


bind = $mainmod, 1, workspace, 1
bind = $mainmod, 2, workspace, 2
bind = $mainmod, 3, workspace, 3
bind = $mainmod, 4, workspace, 4
bind = $mainmod, 5, workspace, 5


bind = $mainmod Shift, 1, movetoworkspace, 1
bind = $mainmod Shift, 2, movetoworkspace, 2
bind = $mainmod Shift, 3, movetoworkspace, 3
bind = $mainmod Shift, 4, movetoworkspace, 4
bind = $mainmod Shift, 5, movetoworkspace, 5

bind = $mainmod ALT, S, movetoworkspace, e+0
bind = $mainmod, S, togglespecialworkspace
bind = $mainmod CTRL, S, movetoworkspace, special

#bind = $mainmod SHIFT, RETURN, togglespecialworkspace, term

bindm = $mainmod, mouse:272, movewindow
bindm = $mainmod, mouse:273, resizewindow
